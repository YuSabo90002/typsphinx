name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v0.1.0, v0.2.0b1)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true

permissions:
  contents: write  # Required for creating releases
  id-token: write  # Required for PyPI trusted publishing

jobs:
  # Validate the release before publishing
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for version validation

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      # Every `${{ }}` below is passed through `env:` rather than interpolated
      # into the script body. A `${{ }}` inside `run:` is substituted BEFORE
      # bash parses the script, so a tag name containing `"`, backticks, or
      # `$(...)` -- none of which git forbids -- would execute as code in a job
      # holding `contents: write` / `id-token: write`. Via `env:` the value
      # reaches bash as data. Keep this invariant: no `${{ }}` inside any
      # `run:` block in this file.
      - name: Extract version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify version matches pyproject.toml
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PYPROJECT_VERSION=$(uv run python -c "import sys, importlib; tomllib = importlib.import_module('tomllib' if sys.version_info >= (3, 11) else 'tomli'); print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "pyproject.toml version: $PYPROJECT_VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: pyproject.toml has $PYPROJECT_VERSION but tag is $TAG_VERSION"
            exit 1
          fi

      - name: Verify CHANGELOG has a section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! uv run python scripts/extract_changelog_section.py "$VERSION" >/dev/null; then
            echo "::error::CHANGELOG.md has no usable '## [$VERSION]' section -- add a curated release-notes entry before tagging."
            exit 1
          fi

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Run linters
        run: |
          uv run black --check .
          uv run ruff check .

      - name: Type check
        run: uv run mypy typsphinx/

  # Build the distribution packages
  build:
    name: Build Distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Check package
        run: |
          uv sync --extra dev --locked
          uv run twine check dist/*

      - name: List built files
        run: ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

  # Publish to PyPI (requires PyPI API token or trusted publishing)
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/typsphinx
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/

      # Same `env:`-not-interpolation invariant as the validate job above.
      - name: Extract version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Curated release-notes body, sourced from CHANGELOG.md's own
          # `## [X.Y.Z]` section (REL-04) -- not a `git log` commit dump.
          uv run python scripts/extract_changelog_section.py "${TAG#v}" > release_notes.md

          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "pip install typsphinx==${TAG#v}" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'a') || contains(steps.version.outputs.tag, 'b') || contains(steps.version.outputs.tag, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to TestPyPI (optional, for testing)
  publish-testpypi:
    name: Publish to TestPyPI (Optional)
    needs: build
    runs-on: ubuntu-latest
    if: |
      contains(github.ref, 'beta') ||
      contains(github.ref, 'alpha') ||
      contains(github.ref, 'rc') ||
      contains(inputs.tag, 'beta') ||
      contains(inputs.tag, 'alpha') ||
      contains(inputs.tag, 'rc')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/typsphinx
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
