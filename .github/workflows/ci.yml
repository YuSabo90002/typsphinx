name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13']
        include:
          - python-version: '3.12'
            tox-env: py312
          - python-version: '3.13'
            tox-env: py313

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run tests with tox
        run: uv run tox -e ${{ matrix.tox-env }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            .pytest_cache
            test-results/

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run lint with tox
        run: uv run tox -e lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run type check with tox
        run: uv run tox -e type

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run coverage with tox
        run: uv run tox -e cov -- --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/

  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      # BLD-05/D-13: the editable install used everywhere else in CI cannot
      # detect a narrowed package-data glob -- it never packs a wheel, so a
      # file silently dropped from `pyproject.toml`'s
      # [tool.setuptools.package-data] entry would never surface locally or
      # in any other CI job. This step opens the REAL wheel built by the
      # previous step and proves the bundle's non-.typ canary reached it.
      - name: Verify wheel carries the template bundle
        run: |
          uv run python -c "
          import glob
          import sys
          import zipfile

          wheel = sorted(glob.glob('dist/*.whl'))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          target = 'typsphinx/templates/README.md'
          if target not in names:
              print(
                  f'FATAL: {target!r} is missing from {wheel!r}. '
                  \"pyproject.toml's [tool.setuptools.package-data] glob for \"
                  \"the 'typsphinx' key was narrowed and no longer packs this \"
                  'file into the wheel -- widen it back to templates/**/*.'
              )
              sys.exit(1)
          print(f'OK: {target!r} found in {wheel!r}')
          "

      - name: Check package
        run: |
          uv sync --extra dev --locked
          uv run twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  integration:
    name: Integration Test - ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [basic, advanced]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package and dependencies
        run: uv sync --locked

      - name: Build ${{ matrix.example }} example
        working-directory: examples/${{ matrix.example }}
        run: |
          uv run sphinx-build -b typst . _build/typst
          ls -la _build/typst/

      - name: Upload example output
        uses: actions/upload-artifact@v7
        with:
          name: example-${{ matrix.example }}-output
          path: examples/${{ matrix.example }}/_build/typst/
